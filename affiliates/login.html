<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Login &middot; Partners</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Archivo',sans-serif;background:#050505;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;}
.brand .bb{display:flex;flex-direction:column;line-height:1.05;}
.brand .b1{font-weight:800;font-size:22px;color:#fff;letter-spacing:-.01em;}
.brand .b2{font-size:10px;font-weight:700;letter-spacing:.22em;color:#999;margin-top:4px;}
.card{width:100%;max-width:400px;background:#111;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:40px 34px;}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em;color:#fff;margin-bottom:6px;text-align:center;}
.sub{font-size:14px;color:#999;margin-bottom:28px;text-align:center;}
.field{margin-bottom:18px;}
label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#999;margin-bottom:7px;}
input{width:100%;padding:13px 15px;font-size:15px;font-family:'Archivo',sans-serif;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;outline:none;transition:border-color .15s;}
input:focus{border-color:#7A0A15;}
input::placeholder{color:#555;}
.btn{width:100%;padding:14px;border:none;border-radius:8px;background:#7A0A15;color:#fff;font-weight:700;font-size:15px;font-family:'Archivo',sans-serif;cursor:pointer;transition:background .15s;margin-top:8px;}
.btn:hover{background:#9B0D1A;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.err{color:#ef4444;font-size:13px;min-height:18px;margin-top:-8px;margin-bottom:8px;}
.link{display:block;text-align:center;margin-top:18px;font-size:13px;color:#666;text-decoration:none;font-weight:600;}
.link:hover{color:#9B0D1A;}
.spinner{display:inline-block;width:17px;height:17px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="brand">
  <svg width="34" height="34" viewBox="0 0 100 100" fill="none" aria-label="Tomide Williams">
    <circle cx="50" cy="50" r="46" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <path d="M 25 35 L 75 35" stroke="#7A0A15" stroke-width="7" stroke-linecap="square"/>
    <path d="M 50 35 L 50 75" stroke="#7A0A15" stroke-width="7" stroke-linecap="square"/>
    <path d="M 20 25 L 35 80 L 50 55 L 65 80 L 80 25" stroke="#050505" stroke-width="12" stroke-linejoin="bevel"/>
    <path d="M 20 25 L 35 80 L 50 55 L 65 80 L 80 25" stroke="#ffffff" stroke-width="4" stroke-linejoin="bevel"/>
  </svg>
  <span class="bb"><span class="b1">Partners</span><span class="b2">Tomide Williams</span></span>
</div>

<div class="card">
  <h1>Welcome back</h1>
  <p class="sub">Log in with your email and password.</p>

  <form id="loginForm">
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" required />
    </div>
    <div class="err" id="err"></div>
    <button class="btn" type="submit" id="submitBtn">Log In</button>
  </form>

  <a href="/affiliates/register" class="link">Not a partner yet? Register</a>
</div>

<script>
(function(){
  var form = document.getElementById('loginForm');
  var errEl = document.getElementById('err');
  var btn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    if(!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
      errEl.textContent = 'Please enter a valid email.';
      return;
    }
    if(!password){ errEl.textContent = 'Please enter your password.'; return; }
    errEl.textContent = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Logging in...';

    fetch('/api/partner?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.ok){
        localStorage.setItem('partners_token', d.token || '');
        localStorage.setItem('partners_partner', JSON.stringify(d));
        document.querySelector('.card').innerHTML =
          '<div style="text-align:center;padding:20px 0;">' +
          '<div style="font-weight:800;font-size:22px;margin-bottom:8px;">Welcome back, ' + d.name + '</div>' +
          '<p style="font-size:14px;color:#999;">Redirecting to your dashboard...</p>' +
          '</div>';
        setTimeout(function(){ window.location.href = '/affiliates/dashboard'; }, 800);
      } else {
        errEl.textContent = d.error || 'No account found with that email.';
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    })
    .catch(function(){
      errEl.textContent = 'Network error. Try again.';
      btn.disabled = false;
      btn.textContent = 'Log In';
    });
  });
})();
</script>
</body>
</html>
