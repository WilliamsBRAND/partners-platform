<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace &middot; Partners</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s;}
  .pcard:hover{transform:translateY(-2px);border-color:rgba(122,10,21,.45);}
  .pimg{height:170px;background:linear-gradient(135deg,#1c1c1c,#0c0c0c);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .pimg img{width:100%;height:100%;object-fit:cover;}
  .pimg .ph{font-size:44px;font-weight:800;letter-spacing:.02em;color:#7A0A15;}
  .pbody{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .pbody h3{font-size:17px;font-weight:800;color:#fff;}
  .ptag{font-size:12.5px;color:var(--muted);line-height:1.5;flex:1;}
  .pmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding-top:6px;border-top:1px solid var(--line);}
  .pprice{color:#fff;font-weight:700;}
  .pcomm{color:var(--green);font-weight:700;}
  .foot-btn{padding-top:12px;}
  .btn.w  {background:#fff;color:#111;}
  .btn.w:hover{background:#e7e7e7;box-shadow:0 10px 24px -12px rgba(255,255,255,.3);}
  .btn.sel{background:rgba(34,197,94,.14);border:1.5px solid rgba(34,197,94,.45);color:var(--green);}
</style>
</head>
<body data-page="marketplace">

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="mark" width="34" height="34" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="46" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
        <path d="M 25 35 L 75 35" stroke="#7A0A15" stroke-width="7" stroke-linecap="square"/>
        <path d="M 50 35 L 50 75" stroke="#7A0A15" stroke-width="7" stroke-linecap="square"/>
        <path d="M 20 25 L 35 80 L 50 55 L 65 80 L 80 25" stroke="#050505" stroke-width="12" stroke-linejoin="bevel"/>
        <path d="M 20 25 L 35 80 L 50 55 L 65 80 L 80 25" stroke="#ffffff" stroke-width="4" stroke-linejoin="bevel"/>
      </svg>
      <div class="bb"><div class="brand-name">Partners</div><div class="brand-sub">Tomide Williams</div></div>
    </div>
    <nav class="nav">
      <a class="" href="/affiliates/dashboard" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>Dashboard
      </a>
      <a class="active" href="/affiliates/marketplace" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Marketplace
      </a>
      <a class="" href="/affiliates/my-products" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/><path d="M19 15l1 1-3 3-1.5-1"/></svg>My Products
      </a>
      <a class="" href="/affiliates/leaderboard" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H7.5a1.5 1.5 0 0 0-1.5 1.5V22"/><path d="M14 14.66V17c0 .55.45 1 1 1h1.5a1.5 1.5 0 0 1 1.5 1.5V22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Leaderboard
      </a>
      <a class="" href="/affiliates/funds" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="3"/><path d="M5.5 9.5h.01M18.5 9.5h.01"/></svg>Earnings
      </a>
      <a class="" href="/affiliates/profile" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Profile
      </a>
    </nav>
    <div class="foot">
      <div class="who"><div class="n" id="sbPartnerName">Partner</div><div class="e" id="sbPartnerEmail"></div></div>
      <a href="javascript:void(0)" onclick="App.logout()">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H5M9 16l-4-4 4-4"/><path d="M19 4h-4v16h4z"/></svg>Logout
      </a>
    </div>
  </aside>

<div class="main" id="main">
  <div class="page-head">
    <div class="page-eyebrow">Marketplace</div>
    <h1 class="page-title">Marketplace</h1>
    <div class="page-sub">Explore available products to promote and earn commissions.</div>
  </div>
  <div id="grid" class="mgrid"><div class="loading"><div class="bar"></div> Loading products...</div></div>
</div>

</div>
<script src="/assets/sidebar.js"></script>
<script>
(function () {
  var token = App.getToken();
  if (!token) { window.location.href = '/affiliates/login'; return; }
  loadMarketplace();

  function loadMarketplace() {
    var grid = document.getElementById('grid');
    App.api('marketplace').then(function (d) {
      if (!d.ok || !d.products || !d.products.length) {
        grid.innerHTML = '<div class="empty">No products available right now. Check back soon.</div>';
        return;
      }
      renderProducts(d.products);
    });
  }

  function renderProducts(products) {
    var grid = document.getElementById('grid');
    var html = '';
    products.forEach(function (p) {
      var regularPrice = p.price_kobo ? App.naira(p.price_kobo) : '—';
      var buyerPrice = p.buyer_price_kobo ? App.naira(p.buyer_price_kobo) : regularPrice;
      var partnerEarning = p.partner_earning_kobo ? App.naira(p.partner_earning_kobo) : '';

      html += '<div class="pcard" data-id="' + p.id + '">' +
        '<div class="pimg">' + (p.image_url ? '<img src="' + App.esc(p.image_url) + '" alt="' + App.esc(p.name) + '">' : '<div class="ph">' + App.esc(p.name.slice(0, 1).toUpperCase()) + '</div>') + '</div>' +
        '<div class="pbody">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<h3 style="margin:0;">' + App.esc(p.name) + '</h3>' +
            '<span style="font-size:10.5px;font-weight:800;background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);padding:2px 8px;border-radius:20px;">20% Link Discount</span>' +
          '</div>' +
          (p.tagline ? '<div class="ptag">' + App.esc(p.tagline) + '</div>' : '') +
          '<div class="pmeta" style="flex-direction:column;gap:8px;align-items:stretch;margin-top:auto;padding-top:10px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;">' +
              '<span style="color:var(--muted);">Regular Price:</span>' +
              '<span style="text-decoration:line-through;color:var(--muted);">' + regularPrice + '</span>' +
            '</div>' +
            '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">' +
              '<span style="color:#fff;font-weight:700;">Buyers Pay with Your Link:</span>' +
              '<span style="color:#fff;font-weight:800;background:rgba(255,255,255,.06);padding:2px 8px;border-radius:6px;">' + buyerPrice + ' <span style="color:var(--green);font-size:11px;">(20% OFF)</span></span>' +
            '</div>' +
            '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 10px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);border-radius:8px;">' +
              '<span style="color:var(--green);font-weight:700;">Your 30% Commission:</span>' +
              '<span style="color:var(--green);font-weight:800;">' + (partnerEarning || App.esc(p.commission_label || '30%')) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="foot-btn">' +
            (p.selected
              ? '<button class="btn dark w-100 btn-sel" data-id="' + p.id + '" data-act="remove" style="width:100%;">Promoting — Remove</button>'
              : '<button class="btn w-100 btn-add" data-id="' + p.id + '" data-act="add" style="width:100%;">Promote this product</button>') +
          '</div>' +
        '</div>' +
      '</div>';
    });
    grid.innerHTML = html;
    bindButtons();
  }

  function bindButtons() {
    var grid = document.getElementById('grid');
    if (!grid) return;
    grid.querySelectorAll('button[data-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        var act = btn.getAttribute('data-act');
        btn.disabled = true;
        btn.textContent = 'Updating...';
        App.selectProduct(id, act).then(function (d) {
          if (d && d.ok) {
            App.snack(act === 'add' ? 'Added to My Products. Your link is ready!' : 'Removed from My Products.');
            loadMarketplace();
          } else {
            btn.disabled = false;
            App.snack((d && d.error) || 'Something went wrong.');
          }
        }).catch(function(){
          btn.disabled = false;
          App.snack('Network error');
        });
      });
    });
  }
})();
</script>
</body>
</html>
