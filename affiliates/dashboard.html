<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard &middot; Partners</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .prprod{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s;}
  .prprod:hover{transform:translateY(-2px);border-color:rgba(122,10,21,.45);}
  .primg{height:130px;background:linear-gradient(135deg,#1c1c1c,#0c0c0c);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .primg img{width:100%;height:100%;object-fit:cover;}
  .primg .ph{font-size:38px;font-weight:800;color:#7A0A15;}
  .prbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .prbody h3{font-size:16px;font-weight:800;color:#fff;margin:0;}
  .prstats{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
  .prstats b{color:#fff;}
  .prfoot{margin-top:auto;padding-top:12px;display:flex;gap:8px;}
  .linkbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;}
  .linkbox .lb{flex:1;min-width:180px;font-size:12px;color:#9B0D1A;word-break:break-all;font-weight:600;}
</style>
</head>
<body data-page="dashboard">

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="mark" width="34" height="34" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="46" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
        <path d="M 25 35 L 75 35" stroke="#7A0A15" stroke-width="7" stroke-linecap="square"/>
        <path d="M 50 35 L 50 75" stroke="#7A0A15" stroke-width="7" stroke-linecap="square"/>
        <path d="M 20 25 L 35 80 L 50 55 L 65 80 L 80 25" stroke="#050505" stroke-width="12" stroke-linejoin="bevel"/>
        <path d="M 20 25 L 35 80 L 50 55 L 65 80 L 80 25" stroke="#ffffff" stroke-width="4" stroke-linejoin="bevel"/>
      </svg>
      <div class="bb"><div class="brand-name">Partners</div><div class="brand-sub">Tomide Williams</div></div>
    </div>
    <nav class="nav">
      <a class="active" href="/affiliates/dashboard" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>Dashboard
      </a>
      <a class="" href="/affiliates/marketplace" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Marketplace
      </a>
      <a class="" href="/affiliates/my-products" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/><path d="M19 15l1 1-3 3-1.5-1"/></svg>My Products
      </a>
      <a class="" href="/affiliates/leaderboard" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H7.5a1.5 1.5 0 0 0-1.5 1.5V22"/><path d="M14 14.66V17c0 .55.45 1 1 1h1.5a1.5 1.5 0 0 1 1.5 1.5V22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Leaderboard
      </a>
      <a class="" href="/affiliates/funds" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="3"/><path d="M5.5 9.5h.01M18.5 9.5h.01"/></svg>Earnings
      </a>
      <a class="" href="/affiliates/profile" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Profile
      </a>
    </nav>
    <div class="foot">
      <div class="who"><div class="n" id="sbPartnerName">Partner</div><div class="e" id="sbPartnerEmail"></div></div>
      <a href="javascript:void(0)" onclick="App.logout()">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H5M9 16l-4-4 4-4"/><path d="M19 4h-4v16h4z"/></svg>Logout
      </a>
    </div>
  </aside>

<div class="main" id="main">
  <div class="page-head">
    <div class="page-eyebrow">Overview</div>
    <h1 class="page-title" id="greet">Dashboard</h1>
    <div class="page-sub">Track your referrals, commissions, and access marketing copy & creatives to promote.</div>
  </div>
  <div id="view"><div class="loading"><div class="bar"></div> Loading your dashboard...</div></div>
</div>

</div>
<script src="/assets/sidebar.js"></script>
<script>
(function () {
  if (!App.getToken()) { window.location.href = '/affiliates/login'; return; }

  var partner = (function () { try { return JSON.parse(localStorage.getItem('partners_partner')); } catch (e) { return {}; } })();
  var hour = new Date().getHours();
  var g = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  var greetEl = document.getElementById('greet');
  if (greetEl) greetEl.textContent = g + ', ' + (partner.name || 'Partner') + '.';

  var view = document.getElementById('view');

  function render(d) {
    if (!d || !d.ok) {
      view.innerHTML = '<div class="empty">' + App.esc((d && d.error) || 'Something went wrong.') + '</div>';
      return;
    }

    var html = '';
    var t = d.totals || {};

    // Balance card
    html += '<div class="balance-card"><div class="bl">' +
      '<div class="bl-lbl">Available to withdraw</div>' +
      '<div class="bl-num">' + App.naira(t.available_kobo) + '</div>' +
      '<div class="bl-note">Approved commissions only. You will be paid by manual bank transfer.</div>' +
      '</div>' +
      '<a class="btn" href="/affiliates/funds">Request Withdrawal</a></div>';

    // Totals
    html += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">' +
      '<div class="card stat-card"><div class="lbl">Total Clicks</div><div class="num">' + (t.clicks || 0) + '</div></div>' +
      '<div class="card stat-card"><div class="lbl">Total Sales</div><div class="num">' + (t.sales || 0) + '</div></div>' +
      '<div class="card stat-card"><div class="lbl">Pending</div><div class="num" style="color:var(--amber);">' + App.naira(t.pending_kobo) + '</div></div>' +
      '<div class="card stat-card accent"><div class="lbl">Total Earned</div><div class="num" style="color:var(--green);">' + App.naira(t.earned_kobo) + '</div></div>' +
    '</div>';

    // Leaderboard banner highlight
    html += '<div class="card" style="margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(122,10,21,.15),rgba(0,0,0,.4));border-color:rgba(122,10,21,.3);">' +
      '<div>' +
        '<div style="font-weight:800;font-size:16px;color:#fff;display:flex;align-items:center;gap:8px;">Partner Leaderboard Race</div>' +
        '<div style="font-size:13px;color:var(--muted);margin-top:4px;">Track top performing partners and see who is leading the race across all products.</div>' +
      '</div>' +
      '<a class="btn sm" href="/affiliates/leaderboard" style="white-space:nowrap;">View Standings &rarr;</a>' +
    '</div>';

    // Products section
    if (d.mode === 'none') {
      html += '<div class="section-head"><h2>Products</h2></div>' +
        '<div class="empty" style="color:#888;">You have no products yet. <a href="/affiliates/marketplace" style="color:#7A0A15;">Find products to promote</a></div>';
    } else {
      html += '<div class="section-head"><h2>' + ('Your Products') + '</h2>' +
        (d.mode === 'multi' ? '<a class="count" href="/affiliates/my-products" style="color:#9B0D1A;text-decoration:none;">View all &rarr;</a>' : '') + '</div>';

      html += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));">';
      (d.products || []).forEach(function (p) {
        html += '<div class="prprod">' +
          '<div class="primg">' + (p.image_url ? '<img src="' + App.esc(p.image_url) + '">' : '<div class="ph">' + App.esc(p.name.slice(0, 1).toUpperCase()) + '</div>') + '</div>' +
          '<div class="prbody">' +
            '<h3>' + App.esc(p.name) + '</h3>' +
            '<div class="prstats"><span>Clicks <b>' + (p.clicks || 0) + '</b></span><span>Sales <b>' + (p.sales || 0) + '</b></span><span>Earned <b>' + App.naira(p.earned_kobo) + '</b></span></div>' +
            '<div class="linkbox">' +
              '<div class="lb">' + App.esc(p.link || 'Link not ready') + '</div>' +
              (p.link ? '<button class="copy-btn" data-copy="' + App.esc(p.link) + '" onclick="App.copyLink(this, this.getAttribute(\'data-copy\'))">Copy</button>' : '') +
            '</div>' +
            '<div class="prfoot">' +
              '<a class="btn" style="text-decoration:none;flex:1;text-align:center;" href="/affiliates/product?product_id=' + p.id + '">View & Share</a>' +
              (p.link ? '<button class="btn wa" style="padding:10px 14px;" data-link="' + App.esc(p.link) + '" data-name="' + App.esc(p.name) + '" onclick="App.shareWhatsApp(this.getAttribute(\'data-link\'), \'Hey! Check out \' + this.getAttribute(\'data-name\') + \':\')">Share</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    }

    // Recent sales
    html += '<div class="section-head"><h2>Recent Sales</h2><span class="count">' + (t.sales || 0) + ' total</span></div>';
    if (d.recentSales && d.recentSales.length) {
      html += '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Customer</th><th class="num">Commission</th><th>Status</th></tr></thead><tbody>';
      d.recentSales.forEach(function (s) {
        html += '<tr><td>' + App.fmtDate(s.created_at) + '</td><td>' + App.esc(s.customer_email || '-') + '</td><td class="num">' + App.naira(s.commission_kobo) + '</td><td><span class="status ' + App.esc(s.status) + '">' + App.esc(s.status) + '</span></td></tr>';
      });
      html += '</tbody></table></div>';
    } else {
      html += '<div class="empty">No sales yet. Share your link to start earning.</div>';
    }

    view.innerHTML = html;
  }

  // Instant SWR check
  var cached = App.getCached('dashboard');
  if (cached) render(cached);

  App.api('dashboard').then(function (d) {
    render(d);
  });
})();
</script>
</body>
</html>
