<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Products &middot; Partners</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .pimg{height:150px;background:linear-gradient(135deg,#1c1c1c,#0c0c0c);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .pimg img{width:100%;height:100%;object-fit:cover;}
  .pimg .ph{font-size:40px;font-weight:800;color:#7A0A15;}
  .pbody{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .pbody h3{font-size:16px;font-weight:800;color:#fff;}
  .pstats{display:flex;gap:14px;font-size:13px;color:var(--muted);}
  .pstats b{color:#fff;}
  .plink{font-size:12px;color:#9B0D1A;word-break:break-all;background:rgba(122,10,21,.08);border:1px solid rgba(122,10,21,.25);border-radius:7px;padding:9px 11px;font-weight:600;}
  .pfoot{margin-top:auto;padding-top:12px;display:flex;gap:8px;}
</style>
</head>
<body data-page="myproducts">

<div class="main" id="main">
  <div class="page-head">
    <div class="page-eyebrow">My Products</div>
    <h1 class="page-title">Products You Promote</h1>
    <div class="page-sub">Open a product to copy its affiliate link, share on WhatsApp, and see your sales.</div>
  </div>
  <div id="grid" class="mgrid"></div>
  <div style="margin-top:20px;"><a class="btn ghost" href="/affiliates/marketplace">+ Add more products</a></div>
</div>

<script src="/assets/sidebar.js"></script>
<script>
(function () {
  if (!App.getToken()) { window.location.href = '/affiliates/login'; return; }
  var grid = document.getElementById('grid');

  App.api('dashboard').then(function (d) {
    if (!d.ok) return;
    var products = d.products || [];
    if (!products.length) {
      grid.innerHTML = '<div class="empty">You have no products yet. <a href="/affiliates/marketplace" style="color:#7A0A15;">Find products to promote</a></div>';
      return;
    }
    var html = '';
    products.forEach(function (p) {
      html += '<div class="pcard">' +
        '<div class="pimg">' + (p.image_url ? '<img src="' + App.esc(p.image_url) + '">' : '<div class="ph">' + App.esc(p.name.slice(0, 1).toUpperCase()) + '</div>') + '</div>' +
        '<div class="pbody">' +
          '<h3>' + App.esc(p.name) + '</h3>' +
          '<div class="pstats"><span>Clicks <b>' + (p.clicks || 0) + '</b></span><span>Sales <b>' + (p.sales || 0) + '</b></span><span>Earned <b>' + App.naira(p.earned_kobo) + '</b></span></div>' +
          '<div class="plink" title="' + App.esc(p.link) + '">' + App.esc(p.link) + '</div>' +
          '<div class="pfoot">' +
            '<a class="btn" style="text-decoration:none;" href="/affiliates/product?product_id=' + p.id + '">View product</a>' +
            '<a class="btn ghost" style="text-decoration:none;" href="/affiliates/marketplace">Manage</a>' +
          '</div>' +
        '</div>' +
      '</div>';
    });
    grid.innerHTML = html;
  });
})();
</script>
</body>
</html>
