<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Product &middot; Partners</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .ptop{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:24px;}
  .pheroimg{width:96px;height:96px;border-radius:14px;background:linear-gradient(135deg,#1c1c1c,#0c0c0c);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);flex:0 0 auto;}
  .pheroimg img{width:100%;height:100%;object-fit:cover;}
  .pheroimg .ph{font-size:44px;font-weight:800;color:#7A0A15;}
  .phero h1{font-size:24px;font-weight:800;color:#fff;margin:0;}
  .phero .sub{font-size:13px;color:var(--muted);margin-top:4px;}
  
  .linkbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:24px;}
  .linkbox .lb{flex:1;min-width:200px;font-size:12.5px;color:#9B0D1A;word-break:break-all;font-weight:600;}
  .wa{background:#25D366;border:1px solid #25D366;color:#fff;font-weight:700;}
  .wa:hover{background:#1eb857;box-shadow:0 10px 24px -12px rgba(37,211,102,.6);}

  /* Marketing Hub Styles */
  .mats-section{margin-top:32px;}
  .hub-pills-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .hub-pill-btn{padding:8px 14px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:20px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;font-family:'Archivo',sans-serif;}
  .hub-pill-btn:hover{background:rgba(255,255,255,.08);color:#fff;}
  .hub-pill-btn.active{background:var(--crimson);border-color:var(--crimson);color:#fff;}

  .mats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  
  .swipe-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .swipe-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .swipe-title{font-size:15px;font-weight:800;color:#fff;}
  .mat-badge-tag{font-size:10px;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:6px;letter-spacing:.04em;white-space:nowrap;}
  .mat-badge-tag.dm{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
  .mat-badge-tag.status{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3);}
  .mat-badge-tag.broadcast{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.3);}
  .mat-badge-tag.creative{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3);}
  .mat-badge-tag.drive_link{background:rgba(234,179,8,.15);color:#facc15;border:1px solid rgba(234,179,8,.3);}
  .mat-badge-tag.email{background:rgba(244,63,94,.15);color:#fb7185;border:1px solid rgba(244,63,94,.3);}

  .swipe-body{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:12px 14px;font-size:13px;color:#ddd;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow-y:auto;font-family:'Archivo',sans-serif;}
  .swipe-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap;}
  
  .creative-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .creative-img-wrap{height:190px;background:linear-gradient(135deg,#1c1c1c,#0c0c0c);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .creative-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease;}
  .creative-card:hover .creative-img-wrap img{transform:scale(1.03);}
  .creative-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .creative-title{font-size:14.5px;font-weight:700;color:#fff;}
  .creative-actions{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap;}

  .drive-card{background:rgba(234,179,8,.05);border:1px solid rgba(234,179,8,.22);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .drive-card:hover{border-color:rgba(234,179,8,.4);background:rgba(234,179,8,.08);}

  .asset-link-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .asset-link-title{font-size:13.5px;font-weight:700;color:#fff;}
</style>
</head>
<body data-page="myproducts">

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="mark" width="34" height="34" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="46" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
        <path d="M 25 35 L 75 35" stroke="#7A0A15" stroke-width="7" stroke-linecap="square"/>
        <path d="M 50 35 L 50 75" stroke="#7A0A15" stroke-width="7" stroke-linecap="square"/>
        <path d="M 20 25 L 35 80 L 50 55 L 65 80 L 80 25" stroke="#050505" stroke-width="12" stroke-linejoin="bevel"/>
        <path d="M 20 25 L 35 80 L 50 55 L 65 80 L 80 25" stroke="#ffffff" stroke-width="4" stroke-linejoin="bevel"/>
      </svg>
      <div class="bb"><div class="brand-name">Partners</div><div class="brand-sub">Tomide Williams</div></div>
    </div>
    <nav class="nav">
      <a class="" href="/affiliates/dashboard" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>Dashboard
      </a>
      <a class="" href="/affiliates/marketplace" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Marketplace
      </a>
      <a class="active" href="/affiliates/my-products" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/><path d="M19 15l1 1-3 3-1.5-1"/></svg>My Products
      </a>
      <a class="" href="/affiliates/leaderboard" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H7.5a1.5 1.5 0 0 0-1.5 1.5V22"/><path d="M14 14.66V17c0 .55.45 1 1 1h1.5a1.5 1.5 0 0 1 1.5 1.5V22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Leaderboard
      </a>
      <a class="" href="/affiliates/funds" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="3"/><path d="M5.5 9.5h.01M18.5 9.5h.01"/></svg>Earnings
      </a>
      <a class="" href="/affiliates/profile" data-spa="true">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Profile
      </a>
    </nav>
    <div class="foot">
      <div class="who"><div class="n" id="sbPartnerName">Partner</div><div class="e" id="sbPartnerEmail"></div></div>
      <a href="javascript:void(0)" onclick="App.logout()">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H5M9 16l-4-4 4-4"/><path d="M19 4h-4v16h4z"/></svg>Logout
      </a>
    </div>
  </aside>

<div class="main" id="main">
  <div class="page-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
    <a href="/affiliates/my-products" class="link" style="font-size:13px;">&larr; Back to My Products</a>
    <a id="lbProductBtn" href="/affiliates/leaderboard" class="btn sm ghost">View Product Leaderboard</a>
  </div>
  <div id="view"><div class="loading"><div class="bar"></div> Loading product details...</div></div>
</div>

</div>
<script src="/assets/sidebar.js"></script>
<script>
var _activeProductMats = [];
var _selectedAffCat = 'all';

(function () {
  if (!App.getToken()) { window.location.href = '/affiliates/login'; return; }
  var pid = new URLSearchParams(window.location.search).get('product_id') || '';
  if (!pid) { window.location.href = '/affiliates/my-products'; return; }
  
  var lbBtn = document.getElementById('lbProductBtn');
  if (lbBtn) lbBtn.href = '/affiliates/leaderboard?product_id=' + encodeURIComponent(pid);

  var view = document.getElementById('view');

  function render(d) {
    if (!d || !d.ok) {
      view.innerHTML = '<div class="empty">' + App.esc((d && d.error) || 'Product unavailable.') + '</div>';
      return;
    }

    var p = d.product;
    var mats = d.materials || [];
    _activeProductMats = mats;
    var html = '';

    html += '<div class="ptop">' +
      '<div class="pheroimg">' + (p.image_url ? '<img src="' + App.esc(p.image_url) + '">' : '<div class="ph">' + App.esc(p.name.slice(0, 1).toUpperCase()) + '</div>') + '</div>' +
      '<div class="phero"><h1>' + App.esc(p.name) + '</h1>' +
      '<div class="sub">' + App.esc(p.tagline || p.description || '') + ' &middot; <strong style="color:var(--green);">Commission: ' + App.esc(p.commission_label || '') + '</strong></div></div>' +
    '</div>';

    // Partner & Links
    var partnerCode = (d.partner && d.partner.code) || '';
    var eventLink = p.event_link || (partnerCode ? 'https://nexora.tomidewilliams.com/?pp=' + encodeURIComponent(partnerCode) : p.link);
    var salesLink = p.sales_link || (partnerCode ? 'https://nexora.tomidewilliams.store/?pp=' + encodeURIComponent(partnerCode) : p.link);
    var partnerWaUrl = (d.partner && d.partner.whatsapp_group_url) || '';

    // TWO PROMOTIONAL LINKS CONTAINER
    html += '<div style="display:flex;flex-direction:column;gap:20px;margin-bottom:28px;">';

    // 1. FREE LAUNCH EVENT & WHATSAPP COMMUNITY FUNNEL (.COM)
    html += '<div style="background:var(--panel);border:1px solid rgba(37,211,102,0.3);border-radius:14px;padding:22px;position:relative;">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px;">' +
        '<div>' +
          '<div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#25D366;">' +
            '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#25D366;"></span>' +
            'Link 1 &middot; Free Launch Event &amp; WhatsApp Community Funnel (.com)' +
          '</div>' +
          '<div style="font-size:16px;font-weight:800;color:#fff;margin-top:4px;">' +
            'Free VIP Launch Event Pass' +
          '</div>' +
          '<div style="font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;max-width:680px;">' +
            'Send leads here to claim their <strong>Free VIP Pass</strong> for the Oct 3rd Live Launch Event. When they register, they are automatically redirected directly into your custom WhatsApp group below.' +
          '</div>' +
        '</div>' +
        '<span style="font-size:11px;font-weight:800;color:#25D366;background:rgba(37,211,102,0.1);padding:4px 10px;border-radius:6px;border:1px solid rgba(37,211,102,0.25);white-space:nowrap;">' +
          'FREE EVENT PASS' +
        '</span>' +
      '</div>' +

      '<div class="linkbox" style="margin-bottom:16px;background:#09090b;border-color:rgba(255,255,255,0.08);">' +
        '<div class="lb" style="color:#25D366;font-size:13.5px;">' + App.esc(eventLink) + '</div>' +
        '<button class="copy-btn" data-copy="' + App.esc(eventLink) + '" onclick="App.copyLink(this, this.getAttribute(\'data-copy\'))">Copy Funnel Link</button>' +
        '<button class="btn wa" data-link="' + App.esc(eventLink) + '" data-name="' + App.esc(p.name) + '" onclick="App.shareWhatsApp(this.getAttribute(\'data-link\'), \'Claim your Free VIP Pass to the NEXORA Live Launch Event:\')">Share on WhatsApp</button>' +
      '</div>' +

      // Custom WhatsApp Group Setting
      '<div style="background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:14px 16px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">' +
          '<div style="font-size:13px;font-weight:700;color:#eee;">' +
            'Your WhatsApp Group Link (Optional):' +
          '</div>' +
          (partnerWaUrl ? '<span style="font-size:10.5px;font-weight:800;color:#4ade80;background:rgba(34,197,94,0.12);padding:3px 8px;border-radius:5px;border:1px solid rgba(34,197,94,0.25);">✓ CUSTOM FUNNEL ACTIVE</span>' : '<span style="font-size:10.5px;font-weight:700;color:var(--muted);background:rgba(255,255,255,0.05);padding:3px 8px;border-radius:5px;">○ MASTER GROUP DEFAULT</span>') +
        '</div>' +
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
          '<input type="url" id="partnerWaInput" placeholder="https://chat.whatsapp.com/your-group-invite-link" value="' + App.esc(partnerWaUrl) + '" style="flex:1;min-width:260px;background:#050505;border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:#fff;font-size:13px;outline:none;" />' +
          '<button type="button" class="btn" id="saveWaBtn" onclick="saveCustomWaFunnel()" style="padding:10px 18px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--crimson);">Save WhatsApp Link</button>' +
        '</div>' +
        '<div id="waSaveMsg" style="font-size:11.5px;margin-top:6px;min-height:16px;"></div>' +
        '<div style="font-size:11.5px;color:#888;margin-top:4px;line-height:1.4;">' +
          '💡 <em>Whenever you change this WhatsApp link, your referral URL above (<strong>' + App.esc(eventLink) + '</strong>) never changes — all new registrants will immediately be routed to your new group!</em>' +
        '</div>' +
      '</div>' +
    '</div>';

    // 2. DIRECT COURSE SALES PAGE (.STORE)
    html += '<div style="background:var(--panel);border:1px solid rgba(122,10,21,0.35);border-radius:14px;padding:22px;position:relative;">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px;">' +
        '<div>' +
          '<div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#ff4d5a;">' +
            '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d5a;"></span>' +
            'Link 2 &middot; Direct Course Sales &amp; Payment Page (.store)' +
          '</div>' +
          '<div style="font-size:16px;font-weight:800;color:#fff;margin-top:4px;">' +
            'Direct Checkout &amp; 30% Commission (₦2,280 / sale)' +
          '</div>' +
          '<div style="font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;max-width:680px;">' +
            'Send ready buyers directly to the full course sales &amp; payment page. You earn <strong>30% commission (₦2,280)</strong> credited automatically to your account on every verified purchase.' +
          '</div>' +
        '</div>' +
        '<span style="font-size:11px;font-weight:800;color:#ff4d5a;background:rgba(122,10,21,0.2);padding:4px 10px;border-radius:6px;border:1px solid rgba(122,10,21,0.4);white-space:nowrap;">' +
          '30% COMMISSION &middot; ₦2,280' +
        '</span>' +
      '</div>' +

      '<div class="linkbox" style="margin-bottom:0;background:#09090b;border-color:rgba(255,255,255,0.08);">' +
        '<div class="lb" style="color:#ff6b78;font-size:13.5px;">' + App.esc(salesLink) + '</div>' +
        '<button class="copy-btn" data-copy="' + App.esc(salesLink) + '" onclick="App.copyLink(this, this.getAttribute(\'data-copy\'))">Copy Sales Link</button>' +
        '<button class="btn wa" data-link="' + App.esc(salesLink) + '" data-name="' + App.esc(p.name) + '" onclick="App.shareWhatsApp(this.getAttribute(\'data-link\'), \'Get 20% OFF the full NEXORA Agentic AI Course today:\')">Share on WhatsApp</button>' +
      '</div>' +
    '</div>';

    html += '</div>';

    // Stats
    html += '<div class="grid cols-4" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">' +
      '<div class="card stat-card"><div class="lbl">Clicks</div><div class="num">' + (p.clicks || 0) + '</div></div>' +
      '<div class="card stat-card"><div class="lbl">Sales</div><div class="num">' + (p.sales || 0) + '</div></div>' +
      '<div class="card stat-card"><div class="lbl">Pending</div><div class="num" style="color:var(--amber);">' + App.naira(p.pending_kobo) + '</div></div>' +
      '<div class="card stat-card accent"><div class="lbl">Earned</div><div class="num" style="color:var(--green);">' + App.naira(p.earned_kobo) + '</div></div>' +
    '</div>';

    // MARKETING ASSETS & PROMOTIONAL COPY HUB
    html += '<div class="mats-section" id="marketing">';
    html += '<div class="section-head"><h2>Promotional Materials & Swipe Copy</h2><span class="count">' + mats.length + ' assets ready</span></div>';

    if (!mats.length) {
      html += '<div class="empty" style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;">The creator has not uploaded promotional materials for this product yet. You can still use your referral link above to share and earn!</div>';
    } else {
      // Category Filter Pills
      var counts = { all: mats.length, dm: 0, status: 0, broadcast: 0, creative: 0 };
      mats.forEach(function(m){
        var cat = m.category || (m.type === 'copy' ? 'dm' : (m.type === 'image' ? 'creative' : (m.type === 'link' ? 'creative' : 'dm')));
        if(cat === 'drive_link' || cat === 'image' || cat === 'creative'){
          counts.creative++;
        } else if(counts[cat] !== undefined){
          counts[cat]++;
        } else {
          counts.dm++;
        }
      });

      html += '<div class="hub-pills-bar">' +
        '<button type="button" class="hub-pill-btn active" data-cat="all" onclick="filterAffMats(\'all\')">All Materials (' + counts.all + ')</button>' +
        (counts.dm ? '<button type="button" class="hub-pill-btn" data-cat="dm" onclick="filterAffMats(\'dm\')">DM Copy (' + counts.dm + ')</button>' : '') +
        (counts.status ? '<button type="button" class="hub-pill-btn" data-cat="status" onclick="filterAffMats(\'status\')">Status Sequence (' + counts.status + ')</button>' : '') +
        (counts.broadcast ? '<button type="button" class="hub-pill-btn" data-cat="broadcast" onclick="filterAffMats(\'broadcast\')">Broadcast / WhatsApp Group (' + counts.broadcast + ')</button>' : '') +
        (counts.creative ? '<button type="button" class="hub-pill-btn" data-cat="creative" onclick="filterAffMats(\'creative\')">Creatives &amp; Drive Assets (' + counts.creative + ')</button>' : '') +
      '</div>';

      html += '<div id="affMatsGridContainer">';
      html += renderAffMatsGrid(mats, 'all');
      html += '</div>';
    }
    html += '</div>';

    // Recent sales
    html += '<div class="section-head" style="margin-top:36px;"><h2>Recent Sales</h2><span class="count">' + (p.sales || 0) + ' total</span></div>';
    if (d.sales && d.sales.length) {
      html += '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Customer</th><th class="num">Order</th><th class="num">Commission</th><th>Status</th></tr></thead><tbody>';
      d.sales.forEach(function (s) {
        html += '<tr><td>' + App.fmtDate(s.created_at) + '</td><td>' + App.esc(s.customer_email || '-') + '</td><td class="num">' + App.naira(s.amount_kobo) + '</td><td class="num">' + App.naira(s.commission_kobo) + '</td><td><span class="status ' + App.esc(s.status) + '">' + App.esc(s.status) + '</span></td></tr>';
      });
      html += '</tbody></table></div>';
    } else {
      html += '<div class="empty">No sales yet for this product. Use the marketing copy and creatives above to start promoting!</div>';
    }

    view.innerHTML = html;
  }

  var cached = App.getCached('product', { product_id: pid });
  if (cached) render(cached);

  App.api('product', { params: { product_id: pid } }).then(function (d) {
    render(d);
  });
})();

function getAffCategoryLabel(cat){
  if(cat === 'dm') return 'DM Copy';
  if(cat === 'status') return 'Status Sequence';
  if(cat === 'broadcast') return 'WhatsApp Group / Broadcast';
  if(cat === 'drive_link') return 'Google Drive Vault';
  if(cat === 'creative' || cat === 'image') return 'Promo Creative';
  return 'Marketing Asset';
}

function renderAffMatsGrid(mats, catFilter){
  var filtered = mats.filter(function(m){
    var cat = m.category || (m.type === 'copy' ? 'dm' : (m.type === 'image' ? 'creative' : (m.type === 'link' ? 'creative' : 'dm')));
    if(catFilter === 'all') return true;
    if(catFilter === 'creative') return (cat === 'creative' || cat === 'drive_link' || cat === 'image');
    return cat === catFilter;
  });

  if(!filtered.length){
    return '<div class="empty" style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;">No materials available in this category.</div>';
  }

  var h = '<div class="mats-grid">';
  filtered.forEach(function(m, idx){
    var cat = m.category || (m.type === 'copy' ? 'dm' : (m.type === 'image' ? 'creative' : (m.type === 'link' ? 'drive_link' : 'dm')));
    var catLabel = getAffCategoryLabel(cat);
    var isCopy = (cat === 'dm' || cat === 'status' || cat === 'broadcast' || cat === 'email' || m.type === 'copy' || !!m.content);

    if(cat === 'creative' || (m.type === 'image' && !m.content)){
      // Creative Flyer Card
      h += '<div class="creative-card">' +
        '<div class="creative-img-wrap">' +
          '<img src="' + App.esc(m.url) + '" alt="' + App.esc(m.title) + '" loading="lazy" />' +
        '</div>' +
        '<div class="creative-body">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<span class="mat-badge-tag creative">' + catLabel + '</span>' +
          '</div>' +
          '<div class="creative-title">' + App.esc(m.title) + '</div>' +
          '<div class="creative-actions">' +
            '<button class="btn" style="font-size:12px;padding:8px 14px;font-weight:700;" data-url="' + App.esc(m.url) + '" data-name="' + App.esc(m.title) + '" onclick="downloadCreativeImage(this.getAttribute(\'data-url\'), this.getAttribute(\'data-name\') + \'.png\')">' +
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
              'Download Image' +
            '</button>' +
            '<button class="copy-btn" style="font-size:12px;padding:8px 12px;" data-copy="' + App.esc(m.url) + '" onclick="App.copyLink(this, this.getAttribute(\'data-copy\'))">Copy URL</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    } else if(cat === 'drive_link' || m.drive_url || (m.url && m.url.includes('drive.google.com'))){
      // Google Drive Folder Card
      var driveLink = m.drive_url || m.url;
      h += '<div class="drive-card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<span class="mat-badge-tag drive_link">' + catLabel + '</span>' +
        '</div>' +
        '<div style="font-size:15px;font-weight:800;color:#fff;">' + App.esc(m.title) + '</div>' +
        '<div style="font-size:12.5px;color:var(--muted);line-height:1.5;">Access raw high-resolution videos, Photoshop files, and brand templates in the shared Google Drive folder.</div>' +
        '<div style="margin-top:auto;padding-top:4px;">' +
          '<a class="btn" style="text-decoration:none;font-size:12px;padding:8px 16px;background:rgba(234,179,8,.2);color:#facc15;border:1px solid rgba(234,179,8,.4);font-weight:700;display:inline-flex;align-items:center;gap:6px;" href="' + App.esc(driveLink) + '" target="_blank" rel="noopener">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
            'Open Drive Folder' +
          '</a>' +
        '</div>' +
      '</div>';
    } else if(isCopy){
      // Swipe Copy Script Card
      var copyId = 'aff_swipe_text_' + idx;
      h += '<div class="swipe-card">' +
        '<div class="swipe-header">' +
          '<div class="swipe-title">' + App.esc(m.title) + '</div>' +
          '<span class="mat-badge-tag ' + cat + '">' + catLabel + '</span>' +
        '</div>' +
        '<div class="swipe-body" id="' + copyId + '">' + App.esc(m.content) + '</div>' +
        '<div class="swipe-actions">' +
          '<button class="copy-btn" data-id="' + copyId + '" onclick="copySwipeText(this, this.getAttribute(\'data-id\'))">Copy Script with My Link</button>' +
          '<button class="btn wa" style="padding:8px 14px;font-size:12px;display:inline-flex;align-items:center;gap:5px;" data-id="' + copyId + '" onclick="shareSwipeWhatsApp(this.getAttribute(\'data-id\'))">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>' +
            'WhatsApp' +
          '</button>' +
        '</div>' +
      '</div>';
    } else {
      // General Resource Link Card
      h += '<div class="asset-link-card">' +
        '<div class="asset-link-title">' + App.esc(m.title) + '</div>' +
        '<a class="btn sm" style="text-decoration:none;font-size:12px;padding:8px 14px;" href="' + App.esc(m.url) + '" target="_blank" rel="noopener">Open Resource &rarr;</a>' +
      '</div>';
    }
  });
  h += '</div>';
  return h;
}

function filterAffMats(cat){
  _selectedAffCat = cat;
  document.querySelectorAll('.hub-pill-btn').forEach(function(pill){
    pill.classList.toggle('active', pill.getAttribute('data-cat') === cat);
  });
  var container = document.getElementById('affMatsGridContainer');
  if(container){
    container.innerHTML = renderAffMatsGrid(_activeProductMats, cat);
  }
}

function downloadCreativeImage(url, filename){
  App.snack('Starting image download...');
  fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
    var blobUrl = window.URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename || 'promo-creative.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(blobUrl);
    App.snack('Download complete.');
  }).catch(function(){
    window.open(url, '_blank');
  });
}

function copySwipeText(btn, elementId){
  var el = document.getElementById(elementId);
  if(!el) return;
  var text = el.innerText || el.textContent;
  App.copyLink(btn, text);
}

function shareSwipeWhatsApp(elementId){
  var el = document.getElementById(elementId);
  if(!el) return;
  var text = el.innerText || el.textContent;
  var url = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

function saveCustomWaFunnel() {
  var input = document.getElementById('partnerWaInput');
  var btn = document.getElementById('saveWaBtn');
  var msg = document.getElementById('waSaveMsg');
  if (!input || !btn) return;
  var url = input.value.trim();
  btn.disabled = true;
  btn.textContent = 'Saving...';
  if (msg) msg.textContent = '';
  
  App.api('update-whatsapp', {
    method: 'POST',
    body: JSON.stringify({ whatsapp_group_url: url })
  }).then(function(d) {
    btn.disabled = false;
    btn.textContent = 'Save Funnel Link';
    if (d && d.ok) {
      App.snack('WhatsApp funnel link updated!');
      if (msg) {
        msg.style.color = '#4ade80';
        msg.textContent = url ? '✓ Custom WhatsApp funnel is active! Leads registering with your link will join your group.' : '✓ WhatsApp funnel reset to master group default.';
      }
    } else {
      if (msg) {
        msg.style.color = 'var(--crimson)';
        msg.textContent = (d && d.error) || 'Could not save link. Please check URL format.';
      }
    }
  }).catch(function() {
    btn.disabled = false;
    btn.textContent = 'Save Funnel Link';
    if (msg) {
      msg.style.color = 'var(--crimson)';
      msg.textContent = 'Network error. Please try again.';
    }
  });
}
</script>
